name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Tests, types and style
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: delibee
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: delibee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delibee -d delibee_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: delibee_test
      DB_USERNAME: delibee
      DB_PASSWORD: secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pgsql, pdo_pgsql, intl, mbstring, xml, ctype, json, bcmath, fileinfo
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install and build assets
        run: |
          npm ci
          npm run build

      - name: Coding style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: php artisan test
